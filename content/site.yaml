      icon: "code"
      note: "5,000+ lines in each"
      items:
        - { name: "Kotlin",          icon: "kotlin" }
        - { name: "Jetpack Compose", icon: "jetpackcompose" }
        - { name: "JavaScript",      icon: "javascript" }
        - { name: "Node.js",         icon: "nodedotjs" }
        - { name: "Express",         icon: "express" }
        - { name: "HTML5",           icon: "html5" }
        - { name: "CSS3",            icon: "css" }
        - { name: "C++",             icon: "cplusplus" }
    - name: "Machine learning"
      icon: "brain"
      items:
        - { name: "Python",          icon: "python" }
        - { name: "TensorFlow Lite", icon: "tensorflow" }
        - { name: "CNN",             icon: "network" }
    - name: "Tools"
      icon: "wrench"
      items:
        - { name: "Git & GitHub",     icon: "git" }
        - { name: "Android Studio",   icon: "androidstudio" }
        - { name: "VS Code",          icon: "code-xml" }         # Simple Icons removed visualstudiocode
        - { name: "Business Central", icon: "building-2" }       # Simple Icons removed dynamics365
        - { name: "Cisco networking", icon: "cisco" }
        - { name: "Slack",            icon: "message-square" }   # Simple Icons removed slack
