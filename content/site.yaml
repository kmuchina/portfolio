about:
  heading: "About me"       # no eyebrow
  body: >-
    I'm a Computer Science graduate passionate about building **reliable, scalable and
    user-centred applications**. I enjoy solving complex problems, working with great
    teams, and learning new technologies.
  focus:
    - { label: "Full-stack development", icon: "code",       detail: "Node, Express and the web platform, from API to interface." }
    - { label: "Android development",    icon: "smartphone", detail: "Kotlin and Jetpack Compose apps, shipped on Google Play." }
    - { label: "Machine learning & AI",  icon: "brain",      detail: "On-device models with TensorFlow Lite." }
  # "Currently" comes first and is derived from the experience item whose end is "present".
  facts:
    - { label: "Education",  value: "BSc Computer Science, First Class", detail: "Moi University, 2025" }
    - { label: "Based in",   value: "Nairobi, Kenya",                    detail: "Open to remote & global roles" }
    - { label: "Leadership", value: "IEEE branch chair, project lead",   detail: "Team player, mentor & community builder" }

experience:
  eyebrow: "Experience"
  heading: "Where I've worked"
  action: { label: "View full résumé", url: "/Kennedy_Muchina_Resume.pdf" }
  # Rendered as the career graph (internal/career). Dates are YYYY-MM; end may be
  # "present". type: Internship | Volunteer | Contract | Freelance | Full-time |
  # Part-time. Titles never contain "intern" (the type says it). **bold** marks metrics.
  items:
    - title: "ICT & Digital Innovation"
      org: "Kenya Flower Council"
      type: "Internship"
      icon: "flower-2"
      location: "Karen, Kenya"
      start: "2026-08"
      end: "present"
      bullets:
        - "Owned **end-to-end delivery** of a new certification digital platform for the Audit & Certification Department, authoring the SRS, designing the UI/UX, and shipping a **functional MVP** under the supervision of the Head of IT & Data."
        - "Supporting **AV and PA systems** for events, conferences and meetings."
      skills: ["SRS", "UI/UX design", "MVP delivery", "AV/PA systems"]

    - title: "ICT Officer"
      org: "Kenya Roads Board, Ministry of Roads & Transport"
      type: "Internship"
      icon: "route"
      location: "Eldoret, Kenya"
      start: "2024-05"
      end: "2025-01"
      bullets:
        - "Enhanced software reliability by testing internal programs against specifications, identifying and documenting bugs."
        - "Administered and optimised LAN infrastructure (Cisco switches & routers), achieving **99% network uptime** across the organisation."
        - "Maintained the corporate website, **Microsoft Business Central** portals, and custom **GIS applications**."
        - "Worked with **PricewaterhouseCoopers (PwC)** under a contract with KRB to audit the KeNHA, KURA & KeRRA road agencies."
      skills: ["Cisco networking", "Business Central", "GIS", "Software testing"]

    - title: "Project Lead & Tech Lead"
      org: "IEEE Tech4Good"
      type: "Volunteer"
      icon: "solar-panel"
      location: "Eldoret, Kenya"
      start: "2024-02"
      end: "2024-12"
      bullets:
        - "Secured a **KES 472,785 (USD 3,665)** grant by authoring a winning technical proposal; managed end-to-end delivery of a **5 kW solar installation** for a non-profit organisation."
        - "Led a multidisciplinary engineering team through design, procurement and deployment while training **20+ students** in solar systems and technical safety."
      skills: ["Grant writing", "Solar PV", "Team leadership"]

    - title: "Chairperson"
      org: "IEEE Moi University Student Branch"
      type: "Volunteer"
      icon: "trophy"
      location: "Moi University"
      start: "2023-07"
      end: "2024-07"
      bullets:
        - "Coordinated and delivered **15+ technical workshops** and hackathons in Web, Mobile, IoT and Cloud for an audience of **300+ developers**."
        - "Led the campus team to **regional victory in IEEEXtreme 17.0**, with the highest active team participation in IEEE Region 8 (Africa, Europe & Middle East)."
      skills: ["Community building", "Event leadership", "Team leadership", "Competitive programming"]

