name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Install cwebp (WebP images)
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Build site
        run: go run ./cmd/build -out dist
      - name: Check output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          grep -qx 'kmuchina.com' dist/CNAME
          for f in robots.txt sitemap.xml og.png favicon.svg favicon.ico apple-touch-icon.png site.webmanifest; do test -f "dist/$f"; done
          ls dist/img/profile-*.webp
          test ! -e dist/img/profile.jpg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
